name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check skill structure
        run: ./infra/scripts/check-skill-structure.sh

      - name: Check skill YAML
        run: ./infra/scripts/check-skill-yaml.sh

      - name: Audit skills
        run: ./infra/scripts/audit-skills.sh
