name: linear
kind: integration
version: "2.0.0"
description: "Create and manage Linear issues using structured templates."
severity: medium
tags:
  - linear
  - issues
  - project-management
  - templates

purpose: |
  Manage Linear issues for your team:
  - Create issues using a standard template format
  - Convert plans/reports into properly formatted Linear issues
  - Support creating issues in backlog or specific cycles
  - Work with the developer skill as orchestrator

# =============================================================================
# MODES
# =============================================================================

modes:
  configure:
    description: |
      Discover and cache Linear workspace metadata for faster issue creation.
      Caches: teams, users, projects, labels, cycles.
      Run once per workspace or when metadata changes.
    trigger: "/linear configure"
    outputs:
      - ".claude/linear-cache.yaml"
    procedure:
      - step: "Discover teams"
        command: "mcp__linear-server__list_teams"
        cache_as: "teams"
        extract: "id, name, key"

      - step: "Discover users"
        command: "mcp__linear-server__list_users"
        cache_as: "users"
        extract: "id, name, email, displayName"

      - step: "Discover projects (per team)"
        command: "mcp__linear-server__list_projects"
        cache_as: "projects"
        extract: "id, name, team"

      - step: "Discover labels (per team)"
        command: "mcp__linear-server__list_issue_labels"
        cache_as: "labels"
        extract: "id, name, color, team"

      - step: "Discover cycles (per team)"
        command: "mcp__linear-server__list_cycles"
        cache_as: "cycles"
        extract: "id, number, name, startsAt, endsAt, team"
        note: "Cache cycle numbers, not 'current'/'next' which are dynamic"

      - step: "Write cache"
        detail: |
          Write discovered data to .claude/linear-cache.yaml:
          ```yaml
          # Linear workspace cache
          # Generated by: /linear configure
          # Updated: 2024-01-26T10:00:00Z

          teams:
            - id: "abc-123"
              name: "Engineering"
              key: "ENG"

          users:
            - id: "user-123"
              name: "John Doe"
              email: "john@example.com"

          projects:
            Engineering:
              - id: "proj-123"
                name: "Backend"
              - id: "proj-456"
                name: "Frontend"

          labels:
            Engineering:
              - id: "label-123"
                name: "Bug"
                color: "#ff0000"
              - id: "label-456"
                name: "Feature"
                color: "#00ff00"

          cycles:
            Engineering:
              - id: "cycle-123"
                number: 25
                name: "Sprint 25"
                startsAt: "2024-01-15"
                endsAt: "2024-01-29"
          ```

      - step: "Confirm with user"
        detail: |
          Show summary:
          "Discovered Linear workspace:
          - Teams: 3 (Engineering, Product, Design)
          - Users: 12
          - Projects: 8
          - Labels: 15
          - Cycles: 10 (current: Sprint 25)

          Cache saved to .claude/linear-cache.yaml"

  learn:
    description: |
      Update cache with new workspace data. Use when:
      - New labels, projects, or cycles have been added
      - Cache is stale or missing entries
      - Encountering "not found" errors during issue creation
    trigger: "/linear learn"
    outputs:
      - "Updates .claude/linear-cache.yaml"
    procedure:
      - step: "Load existing cache"
        detail: "Read current .claude/linear-cache.yaml if exists"

      - step: "Fetch current workspace data"
        detail: |
          Re-fetch all entities from Linear API:
          - Teams, users, projects, labels, cycles
          Same as configure, but merges with existing cache.

      - step: "Identify changes"
        detail: |
          Compare fetched data with cached data:
          - New entries added
          - Removed entries (mark as stale)
          - Updated entries (name changes, etc.)

      - step: "Update cache"
        detail: |
          Merge new data into cache:
          - Add new entries
          - Update changed entries
          - Optionally remove stale entries (ask user)

      - step: "Report changes"
        detail: |
          Show what changed:
          "Updated Linear cache:
          - Added 2 new labels: 'P0', 'Security'
          - Added 1 new project: 'Infrastructure'
          - Cycles refreshed (current: Sprint 26)"

  create:
    description: "Create a new Linear issue (default mode)"
    trigger: "/linear or /linear create"

  update:
    description: "Update an existing Linear issue"
    trigger: "/linear update <issue-id>"

cache:
  file: ".claude/linear-cache.yaml"
  usage: |
    When cache exists, use cached IDs instead of API lookups:
    - team name -> team ID (no list_teams call needed)
    - user name -> user ID (no list_users call needed)
    - label name -> label ID (no list_labels call needed)
    - cycle number -> cycle ID (no list_cycles call needed)

    Cache is lazy-loaded on first use of each entity type.
    Run "/linear configure" to refresh cache.

owns:
  - "Linear issue creation for configured team"
  - "Issue template formatting"
  - "Issue metadata management (labels, projects, cycles)"

# Configuration from wizard (stored in skills-config.env)
config:
  LINEAR_DEFAULT_TEAM:
    description: "Default team name in Linear (optional)"
    source: "skills-config.env"
    required: false
    note: "If not set, skill will prompt user to select team each time"

template:
  name: "Standard Issue Template"
  sections:
    - id: problem_statement
      title: "Problem Statement"
      placeholder: "[What problem are we solving and why?]"
      required: true

    - id: proposed_solution
      title: "Proposed Solution"
      placeholder: "[High-level approach]"
      required: false

    - id: acceptance_criteria
      title: "Acceptance Criteria"
      placeholder: |
        1. Given X, when Y, then Z (behavior specifications)
        2. [Performance requirements (if applicable)]
        3. [Testing requirements (if applicable)]
      required: false

    - id: implementation_plan
      title: "Implementation Plan"
      placeholder: "[Specific steps to implement the solution]"
      required: false

    - id: technical_notes
      title: "Technical Notes"
      placeholder: "[Implementation details, gotchas, considerations]"
      required: false

  format: |
    ## Problem Statement

    {problem_statement}

    ## Proposed Solution

    {proposed_solution}

    ## Acceptance Criteria

    {acceptance_criteria}

    ## Implementation Plan

    {implementation_plan}

    ## Technical Notes

    {technical_notes}

inputs_required:
  - id: team
    description: "Linear team to create the issue in"
    required: false
    note: "Falls back to LINEAR_DEFAULT_TEAM config, then prompts user"
    examples:
      - "Engineering"
      - "Product"

  - id: title
    description: "Issue title - concise summary of the task"
    required: true
    examples:
      - "Add retry logic for network timeouts"
      - "Fix memory leak in service"
      - "Implement monitoring alerts"

  - id: problem_statement
    description: "What problem are we solving and why?"
    required: true

  - id: proposed_solution
    description: "High-level approach to solve the problem"
    required: false

  - id: acceptance_criteria
    description: "Behavior specifications in Given/When/Then format"
    required: false

  - id: implementation_plan
    description: "Specific steps to implement the solution"
    required: false

  - id: technical_notes
    description: "Implementation details, gotchas, considerations"
    required: false

  - id: assignee
    description: "User to assign the issue to (name, email, or 'me')"
    required: false

  - id: labels
    description: "Labels to apply to the issue"
    required: false
    examples:
      - "Bug"
      - "Feature"
      - "Improvement"

  - id: project
    description: "Project to add the issue to"
    required: false

  - id: cycle
    description: "Cycle to add the issue to (name, number, or 'current')"
    required: false
    examples:
      - "current"
      - "next"
      - "25"

  - id: priority
    description: "Issue priority (0=None, 1=Urgent, 2=High, 3=Normal, 4=Low)"
    required: false

  - id: estimate
    description: "Story point estimate"
    required: false

  - id: state
    description: "Initial issue state (auto-set to 'Todo' when cycle is specified)"
    required: false
    default_logic: "If cycle is specified -> 'Todo', otherwise -> 'Backlog'"

  - id: parent_id
    description: "Parent issue ID to create this as a sub-issue"
    required: false

  - id: due_date
    description: "Due date in ISO format"
    required: false

  - id: links
    description: "URLs to attach (PRs, docs, etc.)"
    required: false

  - id: blocks
    description: "Issue IDs that this ticket blocks"
    required: false

  - id: blocked_by
    description: "Issue IDs that block this ticket"
    required: false

  - id: related_to
    description: "Related issue IDs"
    required: false

required_outputs:
  - "Linear issue created with proper template formatting"
  - "Issue URL returned to caller"

patterns:
  - id: template-formatting
    description: |
      Always format issue descriptions using the template structure.
      Only include sections that have actual content.
    example: |
      ## Problem Statement

      Users need a way to easily create Linear issues.

      ## Proposed Solution

      Add a skill that guides users through the issue creation process.

      ## Acceptance Criteria

      1. Given a user invokes /linear, then they are guided through issue creation
      2. Testing: Unit tests for skill parsing

  - id: request-missing-info
    description: |
      When called without required information, request it from the caller.
      Minimum required: title and problem_statement.

  - id: cycle-handling
    description: |
      Handle cycle specification:
      - "current" -> fetch current cycle ID
      - "next" -> fetch next cycle ID
      - number -> use cycle number
      - omitted -> create in backlog (no cycle)
    example: |
      # Get current cycle
      list_cycles(teamId="...", type="current")

      # Create in current cycle
      create_issue(..., cycle="current-cycle-id")

      # Create in backlog (no cycle param)
      create_issue(...) # omit cycle parameter

  - id: proposal-before-create
    description: |
      ALWAYS show a proposal wizard before creating a ticket.
      Wait for explicit user approval before proceeding.

  - id: re-approval-after-changes
    description: |
      When user requests ANY changes (even simple ones):
      1. Apply the requested changes
      2. Show the FULL updated proposal again
      3. Wait for EXPLICIT approval
      4. NEVER create the ticket immediately after changes

anti_patterns:
  - id: missing-problem-statement
    description: "Creating issues without a clear problem statement"
    why_bad: "Issues without context are hard to understand and prioritize."

  - id: empty-template-sections
    description: "Leaving sections with placeholder text"
    why_bad: "Provides no value. Better to omit sections than use placeholders."

  - id: skip-proposal
    description: "Creating issues without showing proposal first"
    why_bad: "User should review and approve before creation."

  - id: duplicate-issues
    description: "Creating duplicate issues without checking existing ones"
    why_bad: "Causes confusion and duplicated work."

  - id: create-after-change-request
    description: "Creating ticket immediately after user requests changes"
    why_bad: "User asked for changes, not to create. Must show updated proposal first."

content_extraction:
  description: |
    When given a plan, analysis, or report document, extract content for each
    template section using these rules.

  sections:
    - id: title
      extract_from:
        - "Document title (# heading)"
        - "Executive Summary - first sentence"
        - "Purpose or objective statement"
      transform: |
        Create a concise action-oriented title (5-10 words).
        Format: "[Verb] [what] for [purpose]"

    - id: problem_statement
      extract_from:
        - "## Executive Summary"
        - "## Problem"
        - "## Background"
        - "## Current Pattern"
      transform: |
        Summarize the pain point in 2-4 sentences:
        1. What is the current situation?
        2. Why is it a problem?
        3. What is the impact?

    - id: proposed_solution
      extract_from:
        - "## Proposed Solution"
        - "## Approach"
        - "## Strategy"
        - "## Design"
      transform: |
        Describe the high-level approach in 2-4 sentences.
        Focus on WHAT will be done, not HOW.

    - id: acceptance_criteria
      extract_from:
        - "## Benefits"
        - "## Expected Outcomes"
        - "## Success Criteria"
        - "## Requirements"
      transform: |
        Convert to Given/When/Then format where possible:
        1. Given [precondition], when [action], then [expected result]
        2. Include performance criteria if mentioned
        3. Include testing requirements if applicable

    - id: implementation_plan
      extract_from:
        - "## Implementation Steps"
        - "## Step 1, Step 2, ..."
        - "Numbered implementation instructions"
        - "File/line number references"
      transform: |
        Create actionable steps with specific, verifiable actions.

    - id: technical_notes
      extract_from:
        - "## Risks and Mitigations"
        - "## Gotchas"
        - "## Edge Cases"
        - "## Related Files"
        - "## Dependencies"
      transform: |
        Include:
        - Known risks with mitigations
        - Files/modules affected
        - Dependencies or prerequisites
        - Potential gotchas

  empty_section_handling: |
    If a section cannot be extracted from the document:
    - Required sections (problem_statement): Ask user for clarification
    - Optional sections: Omit entirely from the ticket
    - NEVER use placeholder text like "[To be filled]"

metadata_inference:
  description: |
    When creating a ticket from a plan, infer metadata options using these rules.

  fields:
    - id: labels
      inference: "auto"
      rules: |
        Infer from the nature of the work:
        - "Bug" -> fixing broken behavior, errors, crashes
        - "Feature" -> new functionality that didn't exist
        - "Improvement" -> enhancing existing functionality, refactoring
        - "Documentation" -> docs updates
        - "Test" -> adding/improving tests
        Multiple labels can apply.

    - id: project
      inference: "auto"
      rules: |
        Infer from the affected area/module described in the plan.
        If unclear, ask user or omit.

    - id: estimate
      inference: "auto"
      rules: |
        Estimate story points based on scope:
        - 1 point -> 1-3 files, simple change
        - 2 points -> 1-5 files, moderate complexity
        - 3 points -> 5-10 files, some complexity
        - 5 points -> 10-20 files, significant work
        - 8 points -> 20+ files, architectural

    - id: priority
      inference: "ask_unless_obvious"
      rules: |
        Usually ask user. Only infer if plan contains:
        - Urgent language: "critical", "blocking" -> 1 (Urgent)
        - Important: "high priority" -> 2 (High)
        - Normal: no urgency indicators -> omit

    - id: cycle
      inference: "user_provided"
      rules: |
        Always use what user specifies:
        - "current" -> resolve to current cycle ID
        - "next" -> resolve to next cycle ID
        - not specified -> backlog (no cycle)

    - id: state
      inference: "auto_from_cycle"
      rules: |
        Automatically determined based on cycle:
        - Cycle specified -> state = "Todo"
        - No cycle -> state = "Backlog"

    - id: assignee
      inference: "ask_or_default"
      rules: |
        If user doesn't specify, ask or leave unassigned.

    - id: related_to
      inference: "auto_extract"
      rules: |
        Scan the plan for issue references matching team key pattern.

handoffs:
  - skill: "developer"
    when: "Developer skill orchestrates and provides plan data for issue creation."
  - skill: "plan"
    when: "If a plan needs to be created before the issue."

procedure:
  - step: "Load cache (if exists)"
    detail: |
      Check for .claude/linear-cache.yaml
      If exists, load cached teams, users, projects, labels, cycles.
      This enables fast lookups without API calls.

      If cache doesn't exist, suggest running "/linear configure" first.

  - step: "Determine team"
    detail: |
      1. Check if team is specified in the request
      2. If not, check LINEAR_DEFAULT_TEAM from skills-config.env
      3. If still not set:
         - If cache exists, show cached teams for selection
         - Otherwise, call list_teams() and ask user to select

      Example team selection prompt:
      "Which team should this issue be created in?
      - Engineering (ENG)
      - Product (PROD)"

  - step: "Receive request"
    detail: |
      When invoked, determine the source:
      - Direct invocation: User provides issue details directly
      - From developer skill: Expect plan data to be provided

      If no plan or issue details provided, ask:
      "Please provide the issue details or plan. I need at minimum:
      - Title
      - Problem Statement"

  - step: "Extract content from plan"
    detail: |
      Use content_extraction rules to map plan sections to template fields.
      Use metadata_inference rules to determine metadata options.

  - step: "Show proposal wizard"
    detail: |
      BEFORE creating the ticket, show a proposal for discussion.

      Format:
      ```
      ## Ticket Proposal

      **Title:** [inferred title]

      ### Metadata
      | Field | Value | Reasoning |
      |-------|-------|-----------|
      | Labels | [value] | [why this label] |
      | Project | [value] | [why this project] |
      | Estimate | [value] | [calculation breakdown] |
      | Cycle | [value] | [user specified or backlog] |
      | State | [value] | [auto from cycle] |

      ### Description Preview
      [First 3-5 lines of each section]

      ---
      **Ready to create?** Or adjust any options?
      ```

      Wait for user confirmation before proceeding.

  - step: "Handle user feedback"
    detail: |
      CRITICAL: When user requests ANY changes:
      1. Apply the requested changes
      2. Show the FULL updated proposal again
      3. Wait for EXPLICIT approval
      4. NEVER create the ticket immediately after changes

  - step: "Resolve cycle and state"
    detail: |
      If cycle is specified:
      - "current" -> call list_cycles with type="current"
      - "next" -> call list_cycles with type="next"
      - AUTO-SET state to "Todo"

      If cycle not specified:
      - Issue goes to backlog
      - State defaults to "Backlog"

  - step: "Create the issue"
    detail: |
      Only after user approves the proposal.

      Use mcp__linear-server__create_issue with:

      Required:
      - team: LINEAR_TEAM_NAME from config
      - title: issue title
      - description: formatted template content

      Metadata (if provided):
      - assignee, labels, project, cycle, priority, estimate, state, dueDate

      Relationships (if provided):
      - parentId, links, blocks, blockedBy, relatedTo

  - step: "Return result"
    detail: |
      Return the created issue information:
      - Issue identifier
      - Issue URL
      - Confirmation message

troubleshooting:
  - issue: "Issue creation fails with 'team not found'"
    diagnosis: |
      list_teams(query="team-name")
    fix: |
      Verify LINEAR_TEAM_NAME in skills-config.env matches exactly.

  - issue: "Cycle not found"
    diagnosis: |
      list_cycles(teamId="...")
    fix: |
      Use "current" to get current cycle, or omit for backlog.

  - issue: "Label not found"
    diagnosis: |
      list_issue_labels(team="team-name")
    fix: |
      Use exact label name from the list.

  - issue: "Project not found"
    diagnosis: |
      list_projects(team="team-name")
    fix: |
      Use exact project name or ID from the list.
