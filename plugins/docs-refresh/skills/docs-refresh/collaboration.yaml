dependencies:
  - skill: create-skill
    required: false
    reason: "After creating a new skill, run docs-refresh to update documentation"

composition:
  - when: "Creating a new skill"
    sequence:
      - create-skill
      - docs-refresh

  - when: "Modifying skill patterns or ownership"
    sequence:
      - docs-refresh

complements:
  - skill: create-skill
    relationship: "After creating a skill, refresh docs to update inventory"

workflow:
  after_skill_change:
    description: "Standard workflow after modifying any skill"
    steps:
      - "Run documentation refresh command"
      - "Stage updated documentation files"
      - "Commit with related changes"

  after_source_change:
    description: "Standard workflow after modifying source files that generate docs"
    steps:
      - "Run documentation refresh command"
      - "Review generated changes"
      - "Stage and commit with source changes"
