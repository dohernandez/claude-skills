version: 1
description: "Validations for pr-create skill"

# PR-create validations:
# - Skill structure is valid
# - No AI attribution in PRs

validations:
  - id: skill-structure-valid
    name: "Skill has required files and valid YAML"
    type: command
    command: "task -t .claude/Taskfile.yaml claude:check-structure -- --skill pr-create"
    expect: "exit 0"
    message: "Skill structure validation failed."

  - id: no-ai-attribution
    name: "PR title and body contain no AI attribution"
    type: command
    command: |
      gh pr view --json title,body -q '.title + " " + .body' 2>/dev/null | \
      grep -qiE 'co-authored-by.*(claude|gpt|ai|copilot)|generated by|created with' && exit 1 || exit 0
    expect: "exit 0"
    message: "AI attribution detected in PR. Remove all references to Claude, GPT, Co-Authored-By AI, etc."

on_stop:
  - skill-structure-valid
  - no-ai-attribution
