# Collaboration: skill dependencies and composition

name: task
version: "1.0.0"

dependencies:
  - skill: domain-expert
    reason: "Understand domain concepts before planning"
    optional: false

  - skill: arch
    reason: "Map changes to correct architecture layers"
    optional: false

  - skill: developer
    reason: "Follow code patterns during implementation"
    optional: false

  - skill: tdd
    reason: "Write tests alongside implementation"
    optional: false

composition:
  - when: "Implementing a feature or chore"
    sequence:
      - task  # Scope → Plan → Implement → Verify

  - when: "Full workflow with task"
    sequence:
      - workflow-setup  # Create branch
      - task            # Do the work
      - commit          # Commit changes
      - pr-create       # Create PR

provides_to:
  - skill: workflow
    data: "Completed implementation ready for commit"

receives_from:
  - skill: workflow
    data: "Task description and type from ticket"

memory_integration:
  reads: "MEMORY.md for task execution patterns, validation sequences, checkpoint learnings"
  writes_via: "memory skill routes workflow learnings here"
  capture_triggers:
    - "Task execution pattern discovered"
    - "Validation sequence preference identified"
    - "Implementation approach decision made"
