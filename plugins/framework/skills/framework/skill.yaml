name: framework
kind: meta
version: "1.0.0"
description: "Install and configure Claude Code skills from the dohernandez-claude-skills marketplace."
severity: low
tags:
  - framework
  - installation
  - configuration
  - orchestrator
  - meta

purpose: |
  Orchestrates installation and configuration of Claude Code skills:
  1. Install skills by tier (minimal, standard, full) or individually
  2. Manage installed skills (list, update, uninstall)
  3. Configure installed skills
  4. Show status of installation and configuration

  The framework uses `claude plugin install` to install each skill as a
  standalone plugin, giving users granular control over which skills they use.

owns:
  - "Skill installation orchestration"
  - "Tier-based skill management"
  - "Framework-level configuration"
  - ".claude/skills-config.env management"

# Marketplace configuration
marketplace:
  name: "dohernandez-claude-skills"
  plugin_pattern: "<skill>@dohernandez-claude-skills"

# All available skills
all_skills:
  - name: arch
    description: "Architecture patterns and layer boundaries"
    configurable: true
  - name: bugfix
    description: "Systematic bug investigation"
    configurable: false
  - name: code
    description: "Code style enforcement"
    configurable: true
  - name: commit
    description: "Git commits with conventional format"
    configurable: true
  - name: create-skill
    description: "Scaffold new skills"
    configurable: false
  - name: debugger
    description: "Production issue debugging"
    configurable: true
  - name: deploy
    description: "Deployment workflow"
    configurable: true
  - name: deploy-verify
    description: "Post-deployment verification"
    configurable: true
  - name: developer
    description: "Development orchestration"
    configurable: true
  - name: docs-refresh
    description: "Documentation generation"
    configurable: true
  - name: domain-expert
    description: "Domain knowledge"
    configurable: true
  - name: linear
    description: "Linear issue management"
    configurable: true
  - name: pr-create
    description: "Create GitHub PRs"
    configurable: false
  - name: pr-merge
    description: "Merge PRs with CI validation"
    configurable: false
  - name: setup
    description: "Project setup"
    configurable: true
  - name: slack
    description: "Slack integration"
    configurable: true
  - name: task
    description: "Task execution"
    configurable: true
  - name: tdd
    description: "Test-driven development"
    configurable: true
  - name: test
    description: "Smart test runner"
    configurable: true
  - name: workflow
    description: "Workflow orchestration"
    configurable: true
  - name: workflow-finish
    description: "Complete workflow cleanup"
    configurable: true
  - name: workflow-setup
    description: "Initialize workflow"
    configurable: false

# Skill Tiers - defines which skills are included in each tier
tiers:
  minimal:
    description: "Core workflow skills for any project"
    count: 11
    skills:
      - commit
      - create-skill
      - docs-refresh
      - linear
      - pr-create
      - pr-merge
      - setup
      - task
      - bugfix
      - workflow-finish
      - workflow-setup

  standard:
    description: "Minimal + deployment and development skills"
    count: 16
    includes: minimal
    additional_skills:
      - deploy
      - deploy-verify
      - developer
      - code
      - test

  full:
    description: "All available skills"
    count: 22
    skills:
      - arch
      - bugfix
      - code
      - commit
      - create-skill
      - debugger
      - deploy
      - deploy-verify
      - developer
      - docs-refresh
      - domain-expert
      - linear
      - pr-create
      - pr-merge
      - setup
      - slack
      - task
      - tdd
      - test
      - workflow
      - workflow-finish
      - workflow-setup

# Installation scopes
scopes:
  - name: project
    location: ".claude/settings.json"
    git_shared: true
    description: "Shared with team via version control"
    recommended: true
  - name: local
    location: ".claude/settings.local.json"
    git_shared: false
    description: "Project-specific, gitignored"
  - name: user
    location: "~/.claude/settings.json"
    git_shared: false
    description: "Global installation for all projects"

commands:
  - name: install
    description: "Add specific skills after initial setup"
    trigger: "/framework install <skills>"
    procedure:
      - step: "Parse skill names"
        detail: |
          Parse comma-separated skill names from argument.
          Validate each skill name exists in the marketplace.

      - step: "Determine scope"
        detail: |
          Check FRAMEWORK_TIER in .claude/skills-config.env to determine
          which scope was used during initial setup.

          If not found, ask user for scope.

      - step: "Install each skill"
        detail: |
          For each skill, run:
          ```bash
          claude plugin install <skill>@dohernandez-claude-skills --scope <scope>
          ```

          Show progress:
          [1/N] Installing <skill>...
            → claude plugin install <skill>@dohernandez-claude-skills --scope <scope>
            ✓ Installed
          OR
            ✗ Failed: <error message>

      - step: "Show summary"
        detail: |
          Display:
          - Number of skills installed successfully
          - Number of skills that failed (with names)
          - Suggest running /<skill> configure for new skills

  - name: uninstall
    description: "Uninstall a specific skill or all skills"
    trigger: "/framework uninstall <skill|--all>"
    procedure:
      - step: "Check for --all flag"
        detail: |
          If argument is "--all", run the complete uninstall procedure.
          Otherwise, uninstall the specific skill.

      - step: "For specific skill: Validate skill name"
        detail: |
          Verify the skill name is valid and installed.

      - step: "For specific skill: Determine scope"
        detail: |
          Check which scope the skill is installed in by reading:
          - .claude/settings.json (project)
          - .claude/settings.local.json (local)
          - ~/.claude/settings.json (user)

      - step: "For specific skill: Uninstall skill"
        detail: |
          Run:
          ```bash
          claude plugin uninstall <skill>@dohernandez-claude-skills --scope <scope>
          ```

      - step: "For specific skill: Note about config"
        detail: |
          Inform user that .claude/skills/<skill>.yaml config file is preserved.
          They can delete it manually if no longer needed.

      - step: "For --all: Confirm with user"
        detail: |
          Use AskUserQuestion to confirm:
          "This will remove ALL skills from dohernandez-claude-skills and shared infrastructure. Proceed?"
          Options: [Yes, No]

          If No: abort

      - step: "For --all: Get all installed skills"
        detail: |
          Find all installed skills from this marketplace across all scopes.

      - step: "For --all: Uninstall each skill"
        detail: |
          For each installed skill, run:
          ```bash
          claude plugin uninstall <skill>@dohernandez-claude-skills --scope <scope>
          ```

      - step: "For --all: Remove shared infrastructure"
        detail: |
          Remove files installed by the framework setup hook:
          ```bash
          rm -f .claude/Taskfile.yaml
          rm -rf .claude/scripts/
          rm -rf .claude/skills/framework/
          ```

          Note: Preserve .claude/skills/*.yaml config files.

      - step: "For --all: Uninstall framework plugin"
        detail: |
          Finally, uninstall the framework plugin itself:
          ```bash
          claude plugin uninstall framework@dohernandez-claude-skills --scope <scope>
          ```

      - step: "For --all: Show summary"
        detail: |
          Display:
          - Number of skills uninstalled
          - Infrastructure removed
          - Note about preserved config files

  - name: list
    description: "Show installed skills and their status"
    trigger: "/framework list"
    procedure:
      - step: "Check installed skills"
        detail: |
          Read settings files to find installed skills from this marketplace:
          - .claude/settings.json (project scope)
          - .claude/settings.local.json (local scope)
          - ~/.claude/settings.json (user scope)

          Filter for plugins matching: *@dohernandez-claude-skills

      - step: "Display installed skills"
        detail: |
          Show table with:
          - Skill name
          - Description
          - Scope (project/local/user)

      - step: "Display not installed skills"
        detail: |
          Show remaining skills from all_skills that are not installed.

      - step: "Show install commands"
        detail: |
          Suggest:
          - /framework install <skill> - Install specific skill
          - /framework install standard - Upgrade to standard tier

  - name: update
    description: "Update all installed skills to latest version"
    trigger: "/framework update"
    procedure:
      - step: "Get installed skills"
        detail: |
          Same as list command - find all installed skills from this marketplace.

      - step: "Update each skill"
        detail: |
          For each installed skill, run:
          ```bash
          claude plugin update <skill>@dohernandez-claude-skills
          ```

          Show progress for each skill.

      - step: "Show summary"
        detail: |
          Display number of skills updated successfully and any failures.

  - name: configure
    description: "Main command - Install skills by tier and configure them"
    trigger: "/framework configure or /framework"
    procedure:
      - step: "Phase 0: Tier Selection"
        detail: |
          Ask user which skill tier they want using AskUserQuestion:

          Options:
          1. Minimal (Recommended) - 11 skills
             commit, create-skill, docs-refresh, linear, pr-create, pr-merge,
             setup, task, bugfix, workflow-finish, workflow-setup
          2. Standard - 16 skills
             Minimal + deploy, deploy-verify, developer, code, test
          3. Full - 22 skills
             All available skills

      - step: "Phase 0: Scope Selection"
        detail: |
          Ask user which scope to use for installation:

          Options:
          1. project (Recommended) - Shared with team via .claude/settings.json
          2. local - Project-only, gitignored
          3. user - Global installation

      - step: "Phase 0: Install Skills"
        detail: |
          For each skill in the selected tier, run:
          ```bash
          claude plugin install <skill>@dohernandez-claude-skills --scope <scope>
          ```

          Show progress:
          [1/N] Installing <skill>...
            → claude plugin install <skill>@dohernandez-claude-skills --scope <scope>
            ✓ Installed

          Save selected tier to .claude/skills-config.env as FRAMEWORK_TIER

      - step: "Phase 1: Framework Configuration"
        detail: |
          Ask for project-level settings using AskUserQuestion:

          1. PROJECT_NAME (required): Project name for generated code/docs
          2. LINT_COMMAND (optional): Command to run linter
          3. TEST_COMMAND (optional): Command to run tests
          4. TEST_WATCH_COMMAND (optional): Command for test watch mode
          5. TEST_COVERAGE_COMMAND (optional): Command for test coverage
          6. PRECOMMIT_COMMAND (optional): Pre-commit validation command

          Save to .claude/skills-config.env

      - step: "Phase 2: Skill Configuration"
        detail: |
          Get list of installed skills that have configurable: true.

          For each configurable installed skill:
          - Ask "Configure <skill>?" with options: [Configure, Skip]
          - If Skip: skill remains usable with defaults, no config file created
          - If Configure: run the skill's configure procedure

          Show result for each skill (configured/skipped)

      - step: "Phase 3: Summary"
        detail: |
          Show summary:
          - Selected tier and number of skills installed
          - Scope used for installation
          - List of configured skills with config file paths
          - List of skipped skills (usable with defaults)
          - Any skills that failed configuration
          - Instructions for re-configuring individual skills

  - name: status
    description: "Show current installation and configuration status"
    trigger: "/framework status"
    procedure:
      - step: "Check installed skills"
        detail: |
          Find all installed skills and their scopes.

      - step: "Check framework config"
        detail: |
          Read .claude/skills-config.env and show:
          - PROJECT_NAME
          - LINT_COMMAND
          - TEST_COMMAND
          - TEST_WATCH_COMMAND
          - TEST_COVERAGE_COMMAND
          - PRECOMMIT_COMMAND

          Mark each as ✓ if set, ○ if not set

      - step: "Check skill configs"
        detail: |
          For each installed skill with configurable: true:
          - Check if .claude/skills/<skill>.yaml exists
          - Mark as ✓ if exists, ○ if using defaults

      - step: "Show summary"
        detail: |
          Display:
          - Installation status (tier, count, scope)
          - Framework config status
          - Skill config status
          - Suggested commands

config_location: ".claude/skills-config.env"

skills_requiring_configure:
  - arch
  - code
  - commit
  - debugger
  - deploy
  - deploy-verify
  - developer
  - docs-refresh
  - domain-expert
  - linear
  - setup
  - slack
  - task
  - tdd
  - test
  - workflow
  - workflow-finish

patterns:
  - id: tier-based-installation
    description: |
      Install skills by tier for convenience:
      - minimal: Core workflow (11 skills)
      - standard: Development + deployment (16 skills)
      - full: Everything (22 skills)

      Users can also install individual skills for fine-grained control.

  - id: scope-selection
    description: |
      Always ask user for scope before installation:
      - project: Shared via git, team collaboration
      - local: Personal additions, not shared
      - user: Global, all projects

  - id: fail-continue
    description: |
      If a skill installation fails:
      1. Log the error
      2. Continue with next skill
      3. Report failures at the end

      Don't block the entire installation on one failure.

  - id: idempotent-operations
    description: |
      All operations are idempotent:
      - Installing already-installed skill: no-op or update
      - Configuring already-configured skill: overwrites
      - Running /framework install multiple times is safe

anti_patterns:
  - id: skip-scope-selection
    description: "Installing without asking for scope"
    why_bad: "User may want different scopes for different contexts"
    solution: "Always ask for scope before installation"

  - id: silent-failures
    description: "Failing silently during installation"
    why_bad: "User won't know which skills failed"
    solution: "Log errors and show summary at the end"

  - id: auto-configure
    description: "Auto-configuring skills without user consent"
    why_bad: "User should review and approve each configuration"
    solution: "Always ask before running skill configure"

outputs:
  - name: skills-config.env
    location: ".claude/skills-config.env"
    description: "Framework-level configuration"
    format: |
      PROJECT_NAME=my-project
      LINT_COMMAND=npm run lint
      TEST_COMMAND=npm test
      TEST_WATCH_COMMAND=npm test -- --watch
      TEST_COVERAGE_COMMAND=npm test -- --coverage
      PRECOMMIT_COMMAND=

  - name: skill-configs
    location: ".claude/skills/<skill>.yaml"
    description: "Per-skill configuration files (created by /skill configure)"
