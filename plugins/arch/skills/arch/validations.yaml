# Validations to run when skill completes (on_stop hook)
# on_stop:
#   - domain-no-outer-imports
#   - infra-no-app-imports
#   - config-no-internal-imports

customization_guide: |
  To set up validations for your project:

  1. Determine your layer names and paths from skills-config.yaml
  2. Create validation commands that check import violations
  3. Add to on_stop list for automatic checking

  Example for hexagonal with src/ structure:

  ```yaml
  validations:
    - id: domain-no-outer-imports
      type: command
      command: |
        ! grep -rE 'from.*(infrastructure|application)' src/domain/ 2>/dev/null || \
        grep -rE 'from.*(infrastructure|application)' src/domain/ | \
        grep -vE '(context|logger|benchmark)' | \
        grep -q .
      expect: "exit 0"
      message: "Domain imports outer layer (except allowed cross-cutting concerns)"

  on_stop:
    - domain-no-outer-imports
  ```

  For custom architecture styles, adapt the grep patterns to match your layer paths.
