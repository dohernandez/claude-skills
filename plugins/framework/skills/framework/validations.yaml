# Validations for framework
# v1 supports command validations only

name: framework
version: "1.0.0"

validations:
  - id: skills-dir-exists
    type: command
    command: "test -d .claude/skills"
    description: "Skills directory exists"
    failure_message: "Skills directory not found. Run claude --init first."

  - id: config-exists
    type: command
    command: "test -f .claude/skills-config.env"
    description: "Framework config exists"
    failure_message: "Framework config not found. Run /framework configure."

on_stop:
  - skills-dir-exists
