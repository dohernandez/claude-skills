# Collaboration: skill dependencies and composition

collaborates_with:
  - skill: arch
    relationship: "complementary"
    handoff: |
      If the new skill changes code organization or touches layer boundaries,
      use arch skill to validate architecture compliance.

  - skill: code
    relationship: "complementary"
    handoff: |
      If the new skill defines coding patterns or style guidelines,
      use code skill to validate style compliance.

boundaries:
  this_skill_handles:
    - "Skill scaffolding under .claude/skills/*/"
    - "Multi-YAML canonical file layout"
    - "Stop hook discipline"

  this_skill_does_not_handle:
    - "Skill content/procedure design"
    - "Validation target creation"
    - "Project-specific configurations"

composition:
  - when: "Creating a brand new skill"
    sequence:
      - create-skill
      - "Validation is automatic on Stop (create-skill installs bundled infra into .claude/ and runs check-structure)"
      - "Re-run manually if needed: task -t .claude/Taskfile.skills.yaml validate-skill -- --skill {folder-name}"
