# Collaboration: skill dependencies and composition
#
# NOTE: composition.sequence lists skill names only.

name: workflow
version: "1.0.0"

dependencies:
  - skill: workflow-setup
    reason: "Creates worktree, copies files, opens IDE during start phase"
    optional: false
  - skill: developer
    reason: "Invoked after setup to plan implementation (in new Claude session)"
    optional: false
  - skill: pr-merge
    reason: "Handles PR merge with strict CI validation (delegated from /workflow merge)"
    optional: false

# workflow-setup handles the environment setup
# developer handles planning (invoked by new Claude session via pending-action.json)
# pr-merge handles the merge logic with strict CI validation

composition:
  - when: "Starting work on a ticket"
    sequence:
      - workflow       # Detects source, generates branch name
      - workflow-setup # Creates worktree, copies files, opens IDE
      # --- Session boundary: new Claude opens in IDE ---
      - developer      # Plans implementation (reads pending-action.json)

  - when: "Merging PR after review/checks"
    sequence:
      - pr-merge  # Delegated: checks CI, merge state, executes merge

  - when: "Finishing ticket work"
    sequence:
      - workflow  # Captures learnings, updates skills knowledge, cleans up

memory_integration:
  reads: "MEMORY.md for branch strategies, PR preferences, skill invocation order"
  writes_via: "memory skill routes workflow learnings here"
  capture_triggers:
    - "Branch strategy preference identified"
    - "PR workflow preference learned"
    - "Skill invocation order discovered"
    - "Worktree pattern preference identified"
