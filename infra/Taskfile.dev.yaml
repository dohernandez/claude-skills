# Claude Skills - User Tasks
# This file is installed to .claude/Taskfile.dev.yaml in target projects
#
# Usage:
#   task -t .claude/Taskfile.dev.yaml test
#   task -t .claude/Taskfile.dev.yaml precommit
#
# Or add to your project's Taskfile.yaml:
#   includes:
#     claude:
#       taskfile: .claude/Taskfile.dev.yaml
#
# Configuration: .claude/skills-config.env

version: '3'

vars:
  # These are set during skill configuration
  # Saved to .claude/skills-config.env
  LINT_COMMAND: '{{.LINT_COMMAND | default ""}}'
  TEST_COMMAND: '{{.TEST_COMMAND | default ""}}'
  TEST_WATCH_COMMAND: '{{.TEST_WATCH_COMMAND | default ""}}'
  TEST_COVERAGE_COMMAND: '{{.TEST_COVERAGE_COMMAND | default ""}}'
  PRECOMMIT_COMMAND: '{{.PRECOMMIT_COMMAND | default ""}}'

# NOTE: dotenv is intentionally NOT set here to allow including this file.
# Target projects should add this to their root Taskfile.yaml:
#   dotenv: ['.claude/skills-config.env', '.env']

tasks:
  lint:
    desc: "Run project linter"
    cmds:
      - cmd: '{{if .LINT_COMMAND}}{{.LINT_COMMAND}}{{else}}echo "LINT_COMMAND not configured - skipping"{{end}}'

  test:
    desc: "Run project tests"
    cmds:
      - cmd: '{{if .TEST_COMMAND}}{{.TEST_COMMAND}}{{else}}echo "TEST_COMMAND not configured - skipping"{{end}}'

  test:watch:
    desc: "Run tests in watch mode"
    cmds:
      - cmd: '{{if .TEST_WATCH_COMMAND}}{{.TEST_WATCH_COMMAND}}{{else}}echo "TEST_WATCH_COMMAND not configured - skipping"{{end}}'

  test:coverage:
    desc: "Run tests with coverage report"
    cmds:
      - cmd: '{{if .TEST_COVERAGE_COMMAND}}{{.TEST_COVERAGE_COMMAND}}{{else}}echo "TEST_COVERAGE_COMMAND not configured - skipping"{{end}}'

  precommit:
    desc: "Run pre-commit checks"
    cmds:
      - cmd: '{{if .PRECOMMIT_COMMAND}}{{.PRECOMMIT_COMMAND}}{{else}}echo "Running lint + test..."{{end}}'
      - task: lint
      - task: test
