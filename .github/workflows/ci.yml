name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Check skill structure
        run: task -t infra/Taskfile.skills.yaml check-structure

      - name: Check skill YAML
        run: task -t infra/Taskfile.skills.yaml validate-skill-yaml

      - name: Audit skills
        run: task -t infra/Taskfile.skills.yaml audit-skills
