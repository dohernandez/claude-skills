version: 1
description: "Validations for setup skill"

# Setup skill validations:
# - Skill structure is valid

validations:
  - id: skill-structure-valid
    type: command
    command: "task -t .claude/Taskfile.yaml check-structure -- --skill setup"
    expect: "exit 0"
    message: "Skill structure validation failed."

on_stop:
  - skill-structure-valid
