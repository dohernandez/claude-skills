name: workflow-setup
kind: workflow
version: "2.0.0"
description: "Setup development environment with git worktree for ticket-based workflows."
severity: medium
tags:
  - workflow
  - git
  - worktree
  - setup
  - developer-experience

purpose: |
  Automate the development environment setup for worktree-based workflows:
  - Create git worktree at configured location
  - Copy environment files (.env*)
  - Install dependencies (via framework setup task)
  - Create workflow directory structure
  - Copy existing plan if present
  - Write pending-action.json for session handoff
  - Open IDE with new worktree

  This skill is called by workflow during the "start" phase.

config_location: ".claude/workflow-config.json"

commands:
  - name: discover
    description: "Configure worktree preferences (called via workflow discover)"
    output: ".claude/workflow-config.json"
    user_approval: required
    procedure:
      - step: "Detect project name"
        detail: |
          Check for project name in order:
            1. package.json → name field
            2. pyproject.toml → [project].name or [tool.poetry].name
            3. go.mod → module name (last segment)
            4. Cargo.toml → [package].name
            5. Current directory name as fallback
      - step: "Suggest worktree base path"
        detail: |
          Default suggestion: ../worktrees/<project-name>
          Explain this keeps worktrees sibling to main repo.
      - step: "Detect installed IDEs"
        detail: |
          Check which IDEs are available:
            - which cursor → Cursor
            - which code → VSCode
            - which webstorm or ls /Applications/*WebStorm* → WebStorm
          Recommend first available, prefer Cursor if installed.
      - step: "Propose configuration"
        detail: |
          Show proposed config to user:
            - worktreeBasePath: <suggested>
            - ide: <detected or Cursor>
            - copyEnvFiles: true
          Use AskUserQuestion for approval/modification.
      - step: "Save configuration"
        detail: |
          Write approved config to .claude/workflow-config.json
          Verify file is in .gitignore (warn if not)

owns:
  - "Git worktree creation for ticket branches"
  - "Environment file copying to worktrees"
  - "Workflow directory structure (.claude/workflow/<branch>/)"
  - "Session handoff via pending-action.json"
  - "IDE opening automation"
  - "Configuration management (.claude/workflow-config.json)"

# Dependency installation uses auto-detection or setup skill cache
# See: setup skill for discovery approach
setup:
  cache_file: ".claude/setup-cache.yaml"
  detection_order:
    - ".claude/setup-cache.yaml"  # Use cached command if available
    - "Taskfile.yaml"              # task setup or task install
    - "Makefile"                   # make setup or make install
    - "package.json"               # npm install
    - "pyproject.toml"             # pip install or poetry install
    - "go.mod"                     # go mod download
    - "Cargo.toml"                 # cargo build

inputs_required:
  - id: branch
    description: "Branch name generated by workflow (with type prefix)"
    examples:
      - "feat/proj-123-add-feature"
      - "fix/proj-456-fix-bug"
  - id: ticketId
    description: "Optional ticket ID"
    examples:
      - "PROJ-123"
      - "ENG-456"
  - id: title
    description: "Ticket title or description"
    examples:
      - "Add user notifications"
      - "Fix login timeout"
  - id: type
    description: "Branch type (feat, fix, refactor, docs, chore, test)"
    examples:
      - "feat"
      - "fix"

required_outputs:
  - "Git worktree created at <basePath>/<branch>"
  - ".env* files copied to worktree"
  - "Dependencies installed in worktree"
  - ".claude/workflow/<branch>/ directory created in worktree"
  - "plan.md copied if source exists"
  - "pending-action.json written for handoff"
  - "IDE opened with worktree directory"

patterns:
  - id: config-file-location
    description: |
      Configuration stored in .claude/workflow-config.json (must be gitignored).
      Contains user preferences for worktree location, IDE, etc.
    example: |
      {
        "worktreeBasePath": "../worktree/my-project",
        "ide": "Cursor",
        "copyEnvFiles": true
      }

  - id: worktree-path-convention
    description: |
      Worktrees created at: <basePath>/<branch-without-type-prefix>
      The type prefix (feat/, fix/, etc.) is stripped from the path to avoid nested directories.
    example: |
      basePath = ../worktree/my-project
      branch = feat/proj-123-add-feature
      worktreePath = ../worktree/my-project/proj-123-add-feature

  - id: workflow-directory-structure
    description: |
      All workflow-related files in .claude/workflow/<branch>/:
      - plan.md: Implementation plan
      - context.json: Ticket metadata
      - pending-action.json: Session handoff
    example: |
      .claude/workflow/feat/proj-123-add-feature/
      ├── plan.md
      ├── context.json
      └── pending-action.json

  - id: pending-action-schema
    description: |
      pending-action.json tells new Claude session what to do.
      Phases: review-plan (plan exists), create-plan (no plan)
    example: |
      {
        "action": "continue-workflow",
        "phase": "review-plan",
        "ticketId": "PROJ-123",
        "branch": "feat/proj-123-add-feature",
        "message": "Workflow setup complete. Review the plan and confirm to proceed.",
        "planFile": "plan.md",
        "createdAt": "2026-01-21T10:30:00Z"
      }

  - id: ide-commands
    description: |
      IDE-specific commands for opening worktree directory.
      Detect OS and use appropriate command.
    example: |
      macOS:
        Cursor: cursor <path>
        WebStorm: open -a "WebStorm" <path>
        VSCode: code <path>
      Linux:
        Cursor: cursor <path>
        WebStorm: webstorm <path>
        VSCode: code <path>

  - id: first-run-prompt
    description: |
      On first run (no config exists), prompt user for preferences.
      Use AskUserQuestion tool for interactive setup.
    example: |
      Q: Where should worktrees be created?
      Default: ../worktree/<project-name>

      Q: Which IDE do you use?
      Options: Cursor, WebStorm, VSCode

anti_patterns:
  - id: copy-node-modules
    description: "Copying node_modules instead of running setup command"
    why_bad: "Symlinks, native modules, and platform-specific builds break when copied"

  - id: hardcoded-paths
    description: "Hardcoding worktree base path instead of using config"
    why_bad: "Different users have different directory structures"

  - id: skip-setup
    description: "Skipping dependency installation to save time"
    why_bad: "Dependencies may be out of sync, causing runtime errors"

  - id: overwrite-existing-worktree
    description: "Creating worktree without checking if path already exists"
    why_bad: "May destroy existing work in that directory"

  - id: missing-pending-action
    description: "Not writing pending-action.json after setup"
    why_bad: "New Claude session won't know to continue workflow"

  - id: config-in-version-control
    description: "Committing workflow-config.json to repository"
    why_bad: "Contains user-specific paths and preferences"

handoffs:
  - skill: "workflow"
    when: "Called by workflow after branch name generation"
    direction: "inbound"
  - skill: "developer"
    when: "New Claude session reads pending-action.json, invokes planning"
    direction: "outbound"

procedure:
  - step: "Load configuration"
    detail: |
      Check if .claude/workflow-config.json exists.
      If exists: load and validate config.
      If not: error - run `/workflow discover` first to configure.

      Config should have been created during framework setup wizard.

  - step: "Validate inputs"
    detail: |
      Verify required inputs from workflow:
        - branch name is provided
        - branch name follows expected format
      Verify config:
        - worktreeBasePath directory exists
        - IDE is supported

  - step: "Update base branch"
    detail: |
      CRITICAL: Update main branch before creating worktree to avoid branching from stale code.

      Run:
        git fetch origin main
        git checkout main
        git pull origin main

      This ensures the worktree is created from the latest remote state.
      If there are local uncommitted changes, warn user first (should have been caught by workflow).

  - step: "Check for existing worktree"
    detail: |
      Check if <basePath>/<branch> already exists.
      If exists: warn user and ask how to proceed:
        - Remove and recreate
        - Use existing
        - Abort

  - step: "Create git worktree"
    detail: |
      Run: git worktree add <basePath>/<branch> -b <branch> main
      Verify worktree created successfully.
      Handle errors (branch exists, path issues, etc.).

  - step: "Copy environment files"
    detail: |
      If copyEnvFiles is true:
        Find all .env* files in source repo root.
        Copy each to worktree root.
        Log which files were copied.

  - step: "Install dependencies"
    detail: |
      Change to worktree directory.
      Detect and run setup command using this order:

      1. Check .claude/setup-cache.yaml for cached command
         If exists: use commands.setup from cache

      2. Check for Taskfile.yaml
         If has "setup" or "install" task: run `task setup` or `task install`

      3. Check for Makefile
         If has "setup" or "install" target: run `make setup` or `make install`

      4. Auto-detect from project type:
         - package.json → npm install
         - pyproject.toml → pip install -e . or poetry install
         - go.mod → go mod download
         - Cargo.toml → cargo build

      Wait for completion (may take time).

  - step: "Create workflow directory"
    detail: |
      Create directory: <worktree>/.claude/workflow/<branch>/
      This holds all workflow-related files.

  - step: "Copy plan if exists"
    detail: |
      Check if .claude/plan.md exists in source repo.
      If exists: copy to <worktree>/.claude/workflow/<branch>/plan.md
      Set phase to "review-plan".
      If not: set phase to "create-plan".

  - step: "Write context.json"
    detail: |
      Write ticket metadata to context.json:
        - ticketId (if provided)
        - title
        - branch
        - type
        - sourceRepo (current repo path)
        - createdAt (ISO timestamp)

  - step: "Write pending-action.json"
    detail: |
      Write handoff file:
        - action: "continue-workflow"
        - phase: "review-plan" or "create-plan"
        - ticketId, branch, title
        - message: User-friendly prompt
        - planFile: "plan.md" (if exists)
        - createdAt: ISO timestamp

  - step: "Open IDE"
    detail: |
      Determine IDE command based on config and OS.
      Run command to open worktree directory.
      Do not wait for IDE to close.
      Log success message.

  - step: "Report completion"
    detail: |
      Inform user setup is complete.
      Provide worktree path.
      Explain next steps (new Claude session will prompt).
