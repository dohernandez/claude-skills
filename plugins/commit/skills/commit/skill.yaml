name: commit
kind: action
version: "2.0.0"
description: "Execute git commit with conventional commit message analysis, intelligent staging, and message generation."
severity: medium
tags:
  - git
  - commit
  - conventional-commits
  - workflow

purpose: |
  Create standardized git commits following Conventional Commits specification.
  Analyze actual diff to determine appropriate type, scope, and message.

  Framework rules enforced:
  - No AI attribution (commits appear as human-authored)
  - No ticket references in commits (belong in PR description)

  Project-specific scopes can be configured via /commit configure.

owns:
  - "Git commit message generation"
  - "Conventional commit format enforcement"
  - "Intelligent staging guidance"

# Optional project configuration generated by /commit configure
# Config location depends on installation model:
#   Plugin installation: .claude/skills/commit.yaml
#   Copied installation: .claude/skills/commit/commit.yaml
config_refs:
  - scopes              # Optional: allowed scopes (e.g., api, auth, db)
  - rules               # Optional: project-specific rules

inputs_required:
  - id: changes
    description: "Staged or unstaged changes to commit"
    examples:
      - "git diff --staged output"
      - "git status --porcelain output"

required_outputs:
  - "Git commit with conventional message"

# =============================================================================
# CONVENTIONAL COMMITS
# =============================================================================

commit_types:
  - type: feat
    purpose: "New feature"
    changelog: true
  - type: fix
    purpose: "Bug fix"
    changelog: true
  - type: docs
    purpose: "Documentation only"
    changelog: "depends on impact"
  - type: style
    purpose: "Formatting/style (no logic)"
    changelog: false
  - type: refactor
    purpose: "Code refactor (no feature/fix)"
    changelog: false
  - type: perf
    purpose: "Performance improvement"
    changelog: true
  - type: test
    purpose: "Add/update tests"
    changelog: false
  - type: build
    purpose: "Build system/dependencies"
    changelog: "depends on impact"
  - type: ci
    purpose: "CI/config changes"
    changelog: false
  - type: chore
    purpose: "Maintenance/misc"
    changelog: "depends on impact"
  - type: revert
    purpose: "Revert commit"
    changelog: true

# Scopes are discovered from the project or configured
# If not configured, infer from directory structure
scopes:
  discovery:
    - method: "config"
      source: "scopes from commit.yaml (see config_refs)"
    - method: "directory"
      source: "Top-level directories in src/"
    - method: "package"
      source: "Workspaces from package.json/go.work/Cargo.toml"

# =============================================================================
# PATTERNS
# =============================================================================

patterns:
  - id: conventional-format
    description: |
      Follow conventional commit format:
      <type>(<scope>): <subject>

      <optional body>
    example: |
      feat(auth): add OAuth2 login support

      Adds Google and GitHub OAuth providers.

  - id: imperative-mood
    description: "Use present tense, imperative mood for subject"
    example: |
      Good: "add feature", "fix bug", "update config"
      Bad: "added feature", "fixes bug", "updated config"

  - id: specific-subjects
    description: "Be specific about what changed, avoid vague words"
    example: |
      Good: "add parallel worker support"
      Bad: "improve worker functionality"

  - id: heredoc-multiline
    description: "Use HEREDOC for multi-line commit messages"
    example: |
      git commit -m "$(cat <<'EOF'
      feat(api): add rate limiting

      Limits requests to 100/minute per API key.
      EOF
      )"

  - id: short-title
    description: "Keep title under 50 characters"
    example: |
      Good (42 chars): "feat(auth): add OAuth2 login support"
      Bad (65 chars): "feat(auth): add OAuth2 login support with Google and GitHub providers"

  - id: changelog-aware-message
    description: |
      Write commit messages with changelog review in mind. The message should
      make it obvious whether the commit is changelog-worthy based on IMPACT, not type.

      Changelog-worthy: Focus on USER/PRODUCT impact
      Internal: Focus on DEVELOPER/PROCESS impact
    example: |
      # Changelog-worthy (user-facing)
      feat(api): add webhook notifications
      fix(auth): prevent session timeout during checkout
      chore(deps): upgrade axios to fix security vulnerability

      # Internal (dev-only)
      chore(ci): add parallel test execution
      test(api): add rate limiting tests
      docs: update development setup instructions

# =============================================================================
# PROCEDURE
# =============================================================================

procedure:
  - step: "Check branch"
    detail: |
      Verify not on main/master branch.
      Refuse to commit directly to protected branches.
    commands:
      - "git branch --show-current"

  - step: "Check git status"
    detail: "Run git status --porcelain to see all changes."
    commands:
      - "git status --porcelain"

  - step: "Check staged changes"
    detail: "If files are staged, show the staged diff."
    commands:
      - "git diff --staged"

  - step: "Stage if needed"
    detail: |
      If nothing staged, show working tree diff and ask user what to stage.
      Never stage .env, credentials, or secrets.
    commands:
      - "git diff"
      - "git add <files>"

  - step: "Analyze changes"
    detail: |
      Determine type, scope, and subject from the diff:
      - Type: What kind of change? (feat, fix, docs, etc.)
      - Scope: What module? (from configured or discovered scopes)
      - Subject: What did it do? (specific, imperative mood)

  - step: "Generate message"
    detail: "Create commit message following format."

  - step: "Confirm with user"
    detail: |
      ALWAYS confirm before committing:
      1. Show the generated commit message
      2. Ask: "Commit with this message? (y/n)"
      3. If yes: proceed to execute
      4. If no: ask "Any changes I should make?" and revise

  - step: "Execute commit"
    detail: "Run git commit with the message using HEREDOC if multi-line."
    commands:
      - 'git commit -m "<type>(<scope>): <subject>"'

# =============================================================================
# ANTI-PATTERNS
# =============================================================================

anti_patterns:
  - id: vague-subject
    description: "Using vague words like 'improve', 'enhance', 'update'"
    why_bad: "Doesn't describe what actually changed. Useless in git log."
    example: |
      Bad: "improve API performance"
      Good: "cache user list in memory"

  - id: past-tense
    description: "Using past tense like 'added', 'fixed', 'updated'"
    why_bad: "Conventional commits use imperative mood (present tense)."

  - id: file-focused
    description: "Describing file operations instead of work done"
    why_bad: "Commits should describe what changed, not what files were touched."
    example: |
      Bad: "add implementation to utils.ts"
      Good: "add date formatting utility"

  - id: long-title
    description: "Title exceeds 50 characters"
    why_bad: "Git log truncates long titles. Keep it concise."

  - id: staging-secrets
    description: "Staging .env, credentials, or secret files"
    why_bad: "Secrets should never be committed to version control."

  - id: commit-on-main
    description: "Committing directly to main/master branch"
    why_bad: "Protected branches should only receive changes via PR."

  - id: amend-after-hook-failure
    description: "Using --amend after pre-commit hook fails"
    why_bad: "Would amend the previous commit, not create new one."

  - id: ai-attribution
    description: "Including Co-Authored-By, 'Generated with', or AI references"
    why_bad: "Framework rule: commits should appear as human-authored work."
    forbidden:
      - "Co-Authored-By: Claude"
      - "Co-Authored-By: GPT"
      - "Generated by"
      - "Created with"
      - "🤖"

  - id: ticket-references
    description: "Including 'Fixes #123' or 'Part of XYZ-123' in commit"
    why_bad: "Framework rule: ticket references belong in PR description, not commits."
    forbidden:
      - "Fixes #"
      - "Closes #"
      - "Part of"
      - "Related to"

# =============================================================================
# SAFETY
# =============================================================================

git_safety:
  protected_branches:
    - main
    - master
  never_do:
    - "Commit directly to protected branches"
    - "Update git config"
    - "Run destructive commands without explicit request"
    - "Skip hooks (--no-verify) unless user asks"
    - "Force push to protected branches"
  on_hook_failure:
    - "Fix the issue"
    - "Create NEW commit (don't amend)"

# =============================================================================
# EXAMPLES
# =============================================================================

examples:
  - name: "Feature commit"
    message: |
      feat(api): add rate limiting

      Limits requests to 100/minute per API key.

  - name: "Bug fix commit"
    message: |
      fix(auth): prevent session timeout during checkout

  - name: "Refactor commit"
    message: |
      refactor(db): extract query builder to separate module

  - name: "Documentation commit"
    message: |
      docs: add API authentication guide

handoffs:
  - skill: workflow
    when: "User wants to start a workflow or manage branches"
  - skill: pr-create
    when: "User wants to create a pull request after committing"
