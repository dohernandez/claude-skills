name: setup
kind: helper
version: "2.0.0"
description: "Project setup and environment configuration with auto-discovery."
severity: low
tags:
  - setup
  - onboarding
  - environment
  - configuration

# Configuration from skills-config.env (set via wizard)
config:
  SETUP_COMMAND:
    description: "Command to install dependencies"
    source: "skills-config.env"
    required: false
  PREREQUISITES:
    description: "Required tools (comma-separated)"
    source: "skills-config.env"
    required: false

purpose: |
  Guide developers through project setup:
  1. Discover project type and requirements
  2. Learn and cache setup configuration
  3. Guide through setup steps
  4. Verify setup is complete

# =============================================================================
# MODES
# =============================================================================

modes:
  configure:
    description: |
      Auto-detect project setup requirements by scanning for indicator files.
      Identifies project type, package manager, prerequisites, and commands.
    trigger: "/setup configure"
    outputs:
      - "Detected project configuration (shown to user)"
    procedure:
      - step: "Detect project type"
        detail: |
          Scan for indicator files:
          - package.json → Node.js
          - pyproject.toml, requirements.txt → Python
          - go.mod → Go
          - Cargo.toml → Rust
          - Gemfile → Ruby
          - pom.xml, build.gradle → Java

      - step: "Detect package manager"
        detail: |
          For Node.js:
          - yarn.lock → yarn
          - pnpm-lock.yaml → pnpm
          - package-lock.json → npm

          For Python:
          - poetry.lock → poetry
          - Pipfile.lock → pipenv
          - requirements.txt → pip

      - step: "Detect prerequisites"
        detail: |
          Read version requirements from:
          - package.json engines
          - .node-version, .nvmrc
          - pyproject.toml python version
          - go.mod go version
          - rust-toolchain.toml

      - step: "Detect setup commands"
        detail: |
          Check for:
          - Taskfile.yaml → task commands
          - Makefile → make targets
          - package.json scripts → npm run scripts

      - step: "Detect environment template"
        detail: |
          Look for:
          - .env.example
          - .env.template
          - .env.sample

      - step: "Present findings"
        detail: |
          Show discovered configuration to user:
          ```
          ## Discovered Setup Configuration

          **Project Type:** Node.js (npm)
          **Node Version:** >=18

          **Prerequisites:**
          - node >= 18
          - task CLI

          **Commands:**
          - Setup: npm install
          - Test: npm test
          - Lint: npm run lint

          **Environment:**
          - Template: .env.example
          - Required vars: DATABASE_URL, API_KEY

          Run `/setup learn` to save this configuration.
          ```

  learn:
    description: |
      Confirm discovered configuration and save to cache.
      User can adjust before saving.
    trigger: "/setup learn"
    requires_confirmation: true
    outputs:
      - ".claude/setup-cache.yaml"
    procedure:
      - step: "Run configurey if needed"
        detail: "If configure hasn't been run, run it first"

      - step: "Present for confirmation"
        detail: |
          Show configuration and ask:
          "Does this look correct? Any adjustments needed?"

      - step: "Write cache file"
        detail: |
          Save to .claude/setup-cache.yaml:
          ```yaml
          # Setup configuration cache
          # Generated by: /setup learn
          # Updated: <timestamp>

          project:
            type: nodejs
            package_manager: npm

          prerequisites:
            - name: node
              version: ">=18"
              check: "node --version"
              install: "brew install node"

          commands:
            setup: "npm install"
            test: "npm test"
            lint: "npm run lint"

          environment:
            template: ".env.example"
            target: ".env"
          ```

      - step: "Confirm"
        detail: "Configuration saved to .claude/setup-cache.yaml"

  guide:
    description: "Guide through setup steps (default mode)"
    trigger: "/setup"
    procedure:
      - step: "Load configuration"
        detail: |
          Load from (in order):
          1. .claude/setup-cache.yaml (if exists)
          2. skills-config.env (SETUP_COMMAND, PREREQUISITES)
          3. Auto-discover if neither exists

      - step: "Check prerequisites"
        detail: |
          For each prerequisite, run check command.
          If missing, show install command.

      - step: "Install dependencies"
        detail: |
          Run setup command:
          ${commands.setup} or ${SETUP_COMMAND}

      - step: "Configure environment"
        detail: |
          If template exists and .env doesn't:
          1. Copy template to .env
          2. Prompt user to fill in values
          3. List required variables

      - step: "Verify setup"
        detail: |
          Run test command to verify working setup:
          task -t .claude/Taskfile.yaml test

  verify:
    description: "Verify setup is complete and working"
    trigger: "/setup verify"
    procedure:
      - step: "Check prerequisites"
        detail: "Run all prerequisite check commands"

      - step: "Check dependencies"
        detail: |
          Verify dependencies installed:
          - Node.js: check node_modules exists
          - Python: check venv or site-packages
          - Go: check go.sum exists
          - Rust: check target directory

      - step: "Check environment"
        detail: "Verify .env exists and has required variables"

      - step: "Run tests"
        detail: "Run test command to confirm working setup"

      - step: "Report status"
        detail: |
          Show verification results:
          ```
          ## Setup Verification

          ✓ Prerequisites installed
          ✓ Dependencies installed
          ✓ Environment configured
          ✓ Tests passing

          Setup is complete!
          ```

cache:
  file: ".claude/setup-cache.yaml"
  usage: |
    Cache stores discovered/confirmed setup configuration.
    Used by guide mode for consistent setup instructions.
    Run "/setup learn" to create or update cache.

owns:
  - "Developer onboarding workflow"
  - "Environment configuration"
  - "Setup verification"

triggers:
  - "setup"
  - "onboarding"
  - "new developer"
  - "environment"
  - ".env"
  - "configure"
  - "install"

patterns:
  - id: fresh-setup
    description: Complete setup for new clone
    example: |
      git clone <repo>
      cd <project>
      ${SETUP_COMMAND}

  - id: verify-setup
    description: Run tests to verify setup worked
    example: |
      task -t .claude/Taskfile.yaml test

  - id: env-configuration
    description: Configure environment variables
    example: |
      cp .env.example .env
      # Edit .env with your values

anti_patterns:
  - id: manual-env-editing
    description: Creating .env from scratch instead of copying template
    problem: Easy to miss required variables or use wrong format
    solution: Copy .env.example and fill in values

  - id: editing-env-example
    description: Editing .env.example directly
    problem: .env.example is a template, changes get committed
    solution: Create a new .env file by copying .env.example

  - id: committing-secrets
    description: Committing .env files with secrets
    problem: Secrets exposed in version control
    solution: .env files should be gitignored, never commit them

  - id: skipping-verification
    description: Skipping tests after setup
    problem: May have broken configuration
    solution: Always run tests after setup

project_detection:
  nodejs:
    indicators:
      - "package.json"
    package_managers:
      npm: "package-lock.json"
      yarn: "yarn.lock"
      pnpm: "pnpm-lock.yaml"
    setup_command: "npm install"
    test_command: "npm test"

  python:
    indicators:
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.py"
    package_managers:
      poetry: "poetry.lock"
      pipenv: "Pipfile.lock"
      pip: "requirements.txt"
    setup_command: "pip install -r requirements.txt"
    test_command: "pytest"

  go:
    indicators:
      - "go.mod"
    setup_command: "go mod download"
    test_command: "go test ./..."

  rust:
    indicators:
      - "Cargo.toml"
    setup_command: "cargo build"
    test_command: "cargo test"

  ruby:
    indicators:
      - "Gemfile"
    setup_command: "bundle install"
    test_command: "bundle exec rspec"
