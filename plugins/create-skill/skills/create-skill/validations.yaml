version: 1
description: "Validations for create-skill"

# Create-skill validations:
# - Skill YAML files are valid
# - Required files exist

validations:
  - id: skill-structure-valid
    type: command
    command: "task -t .claude/Taskfile.skills.yaml check-structure"
    expect: "exit 0"
    message: "Skill structure validation failed (missing files or invalid YAML)."

on_stop:
  - skill-structure-valid
